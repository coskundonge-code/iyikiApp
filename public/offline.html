<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çevrimdışı - iyi ki</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 400px;
        background: white;
        border-radius: 16px;
        padding: 40px 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      }

      .icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      h1 {
        font-size: 24px;
        color: #333;
        margin-bottom: 10px;
        font-weight: 600;
      }

      p {
        color: #666;
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 30px;
      }

      .button {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .button:active {
        transform: translateY(0);
      }

      .offline-badge {
        display: inline-block;
        background: #f5a623;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .tips {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #eee;
        text-align: left;
      }

      .tips h3 {
        font-size: 14px;
        color: #333;
        margin-bottom: 12px;
        font-weight: 600;
      }

      .tips ul {
        list-style: none;
        font-size: 14px;
        color: #666;
      }

      .tips li {
        margin-bottom: 8px;
        padding-left: 20px;
        position: relative;
      }

      .tips li:before {
        content: '✓';
        position: absolute;
        left: 0;
        color: #667eea;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="offline-badge">Çevrimdışı Modu</div>
      <div class="icon">📡</div>
      <h1>İnternet Bağlantısı Yok</h1>
      <p>Çevrimdışı moddasınız. İnternet bağlantısını kontrol edip tekrar deneyin.</p>
      <button class="button" onclick="location.reload()">Tekrar Dene</button>

      <div class="tips">
        <h3>Çevrimdışı'da ne yapabilirsin:</h3>
        <ul>
          <li>Daha önce yüklenen sayfaları görüntüle</li>
          <li>Uygulamayı keşfet</li>
          <li>Ayarlarını kontrol et</li>
        </ul>
      </div>
    </div>
  </body>
</html>
